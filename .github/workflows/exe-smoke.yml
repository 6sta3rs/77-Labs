name: EXE start check
# Weekly and on demand: builds the Windows EXE, starts it on isolated data and checks over the WebView2 debugging port that the
# interface loads, that the settings pages mount, and (when a baseline is recorded) that the cold start is not 50% slower.
# It does not start the engine and does not synthesise anything; see docs/verification/performance.md.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exe-start:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - run: npm ci
      - run: npm run desktop:build
      - run: python -m pip install playwright==1.64.1
      - name: Start the EXE and check it
        shell: bash
        run: |
          baseline=$(node -p "require('./tests/acceptance/cold-start-baseline.json').runnerSeconds ?? ''")
          args=()
          if [ -n "$baseline" ]; then args=(--baseline-seconds "$baseline" --max-factor 1.5); fi
          python tests/acceptance/exe_smoke.py desktop/target/release/seventy-seven-labs.exe "$RUNNER_TEMP/exe-smoke" "${args[@]}" --busy-port
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exe-smoke
          path: ${{ runner.temp }}/exe-smoke
