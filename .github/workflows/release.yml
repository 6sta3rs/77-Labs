name: Release
# A tag v<version> builds the signed installer and the updater feed, attests their provenance and creates a DRAFT release.
# A draft is never the "latest" release, so no installed copy is offered the update until a human publishes it
# (publishing triggers verify-release.yml). See docs/publishing.md for the one-time setup (environment, secrets, reviewers).
# The job that runs build code holds the signing secrets but only read permission; the job that can write to the repository
# and mint attestations runs no build code.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gates:
    # The same gates as the source checks, run on the tagged commit before anything is built or signed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: The tag matches the version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:structure
      - run: python tools/dev/publication_check.py
      - run: python -B tests/runtime/test_analytics_switch.py
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path desktop/Cargo.toml -- -D warnings
      - name: Release notes exist for this version
        shell: bash
        run: node tools/release/changelog-notes.mjs "${GITHUB_REF_NAME#v}"
  build:
    needs: gates
    runs-on: windows-latest
    # A protected environment: required reviewers approve the run, and only this job can read the signing secrets.
    # No caches here: nothing restored from a cache may run next to the signing key.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      # Guards inside build-update.mjs: clean tree, HEAD is the tag, five versions agree. Takes 20-30 minutes (LTO).
      - run: npm run desktop:release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: .tmp/release/${{ github.ref_name }}/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.exe
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node tools/release/changelog-notes.mjs "$version" > "$RUNNER_TEMP/notes.txt"
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.sig release/*.sha256 release/*.json \
            --draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.txt"
