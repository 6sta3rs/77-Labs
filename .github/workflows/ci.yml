name: Source checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:structure
      - run: python -B tests/runtime/test_publication_check.py
      - run: python -B tests/runtime/test_analytics_switch.py
      - run: python tools/dev/publication_check.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:structure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # The interpreter lives in a folder named .venv: one runtime test checks for that, like the private runtime layout.
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -r requirements-ci.txt ruff==0.17.2
      - run: .venv/Scripts/ruff check .
      - run: .venv/Scripts/python tools/dev/run_runtime_tests.py
      - run: npm run test:ui
      # tauri::generate_context! embeds ../dist, so the frontend is built first
      - run: npm run build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - run: cargo check --locked --manifest-path desktop/Cargo.toml
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path desktop/Cargo.toml -- -D warnings
  tauri-build:
    # proves that the release binary links; the steps run only when something that can break it changed
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null || git diff --name-only "$base" HEAD | grep -E '^(desktop/|scripts/runtime/|frontend/|public/|package(-lock)?\.json$|rust-toolchain\.toml$|tools/dev/ai-dev\.ts$|\.github/workflows/ci\.yml$)' > /dev/null; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - if: steps.changed.outputs.run == 'true'
        run: npm run desktop:build
