name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:structure
      - run: python -B tests/runtime/test_publication_check.py
      - run: python scripts/dev/publication_check.py
