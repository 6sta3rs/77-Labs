<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Reakcja czterech kul — GPU</title>
<style>body{font:14px system-ui;background:#eee;color:#222;padding:24px}button{padding:10px 16px}#frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}section{background:#fff;padding:14px;border-radius:12px}section>div{display:flex;gap:12px}figure{margin:0;text-align:center}img{width:128px;height:128px}figcaption{font-size:12px}pre{white-space:pre-wrap}</style>
</head><body><h1>Cztery style: identyczny zegar, różne pasma</h1><p>Te same RMS, seed i czas shadera; osobno cisza, niskie/wysokie pasma, szum i wiarygodne F0. Bez syntezy i mikrofonu.</p>
<button id="run">Porównaj</button><div id="frames"></div><pre id="result"></pre>
<script type="module">
const mode = new URLSearchParams(location.search).get('mode') === 'baseline' ? 'baseline' : 'current';
const moduleUrl = mode === 'baseline' ? '/.tmp/orb-reactivity-baseline/voice-orb.ts' : '/src/lib/playback/voice-orb.ts';
const { VoiceOrbRenderer } = await import(/* @vite-ignore */ moduleUrl);
const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
const width = 128, elapsedSteps = 12, fixedTime = 1.25;
const labels = { original: 'Oryginał', calm: 'Spokojny', storm: 'Burza', intonation: 'Intonacja' };
const features = pitch => ({ rms: .1125, spectralFlux: .08, spectralFlatness: .2, spectralCentroidHz: 2200,
  envelopeModulation: .12, pitchHz: pitch, pitchConfidence: pitch ? 1 : 0, pitchChange: 0, turbulence: .46 });
const quiet = { rms: 0, spectralFlux: 0, spectralFlatness: 0, spectralCentroidHz: 0,
  envelopeModulation: 0, pitchHz: null, pitchConfidence: 0, pitchChange: 0, turbulence: 0 };
const cases = {
  silent: { level: 0, bands: [0, 0, 0, 0], features: quiet },
  low: { level: .45, bands: [.7, .12, .03, .12], features: features(null) },
  high: { level: .45, bands: [.03, .12, .7, .12], features: features(null) },
  noise: { level: .45, bands: [.1, .3, .7, .12], features: { ...features(null), spectralFlatness: .9 } },
  lowPitch: { level: .45, bands: [.3, .5, .08, .12], features: features(110) },
  highPitch: { level: .45, bands: [.3, .5, .08, .12], features: features(440) },
};
const distance = (a, b, alpha = false) => {
  let sum = 0, count = 0, maximum = 0;
  for (let y = 0; y < width; y++) for (let x = 0; x < width; x++) {
    if (!alpha && Math.hypot((x + .5) / width * 2 - 1, (y + .5) / width * 2 - 1) > .94) continue;
    const start = alpha ? 3 : 0, end = alpha ? 4 : 3;
    for (let channel = start; channel < end; channel++) {
      const delta = Math.abs(a[(y * width + x) * 4 + channel] - b[(y * width + x) * 4 + channel]);
      sum += delta; count++; maximum = Math.max(maximum, delta);
    }
  }
  return { mean: sum / count, maximum };
};
async function render(variant, settings) {
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = width;
  const renderer = new VoiceOrbRenderer(canvas);
  try {
    renderer.setVoice('orb-reactivity-proof'); renderer.setVariant(variant);
    renderer.setLevel(settings.level); renderer.setAudioBands(settings.bands); renderer.setFeatures(settings.features);
    const gl = canvas.getContext('webgl');
    for (let step = 0; step < elapsedSteps; step++) {
      if (step % 2 === 0) await frame();
      renderer.draw(1 / 30);
    }
    // Keep audio history from the actual renderer, but freeze animation and
    // grain phase identically before the final controlled GPU draw.
    const program = gl.getParameter(gl.CURRENT_PROGRAM);
    gl.uniform1f(gl.getUniformLocation(program, 'time'), fixedTime);
    gl.uniform1f(gl.getUniformLocation(program, 'energy'), 0);
    gl.uniform2f(gl.getUniformLocation(program, 'resolution'), width, width);
    gl.viewport(0, 0, width, width); gl.drawArrays(gl.TRIANGLES, 0, 3);
    const pixels = new Uint8Array(width * width * 4);
    gl.readPixels(0, 0, width, width, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    const error = gl.getError();
    const strength = gl.getUniformLocation(program, 'pitchStrength');
    return { pixels, image: canvas.toDataURL(), error, pitchStrength: strength ? gl.getUniform(program, strength) : 0 };
  } finally { renderer.dispose(); canvas.getContext('webgl').getExtension('WEBGL_lose_context')?.loseContext(); }
}
window.runOrbReactivityChecks = async () => {
  const checks = [], styles = [], frames = document.querySelector('#frames'); frames.replaceChildren();
  const check = (name, pass, detail) => checks.push({ name, pass, detail });
  for (const variant of ['original', 'calm', 'storm', 'intonation']) {
    const samples = {};
    for (const name of ['silent', 'low', 'high', 'noise']) samples[name] = await render(variant, cases[name]);
    const audio = distance(samples.silent.pixels, samples.low.pixels);
    const spectrum = distance(samples.low.pixels, samples.high.pixels);
    const noise = distance(samples.silent.pixels, samples.noise.pixels);
    const silhouette = distance(samples.silent.pixels, samples.high.pixels, true);
    check(labels[variant] + ': reakcja na mowę/energię', audio.mean > .5, audio);
    check(labels[variant] + ': różne pasma przy identycznym RMS', spectrum.mean > .5, spectrum);
    check(labels[variant] + ': szum reaguje bez udawania F0', noise.mean > .5 && samples.noise.pitchStrength === 0, { noise, pitchStrength: samples.noise.pitchStrength });
    check(labels[variant] + ': nieruchomy obrys i poprawny WebGL', silhouette.maximum === 0 && Object.values(samples).every(sample => sample.error === 0), { silhouette, errors: Object.values(samples).map(sample => sample.error) });
    if (variant === 'intonation') {
      const lowPitch = await render(variant, cases.lowPitch), highPitch = await render(variant, cases.highPitch);
      const melody = distance(lowPitch.pixels, highPitch.pixels);
      check('Intonacja: wiarygodne F0 zmienia falowanie', melody.mean > 1, melody);
      styles.push({ variant, audio, spectrum, noise, melody });
    } else styles.push({ variant, audio, spectrum, noise });
    const section = document.createElement('section'); section.innerHTML = '<h2>' + labels[variant] + '</h2><div></div>';
    for (const name of ['silent', 'low', 'high']) {
      const figure = document.createElement('figure'), image = document.createElement('img'), caption = document.createElement('figcaption');
      image.src = samples[name].image; caption.textContent = { silent: 'Cisza', low: 'Niskie pasma', high: 'Wysokie pasma' }[name];
      figure.append(image, caption); section.querySelector('div').append(figure);
    }
    frames.append(section);
  }
  check('Burza wyraźniejsza od Spokojnego', styles.find(style => style.variant === 'storm').audio.mean > styles.find(style => style.variant === 'calm').audio.mean, styles.map(style => ({ variant: style.variant, audio: style.audio.mean })));
  const result = { mode, baselineCommit: '86384eb', width, fixedTime, fixedEnergy: 0, elapsedSeconds: elapsedSteps / 30,
    passed: checks.filter(check => check.pass).length, total: checks.length, styles, checks };
  window.orbReactivityResult = result; document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
  return result;
};
document.querySelector('#run').onclick = () => window.runOrbReactivityChecks().catch(error => { document.querySelector('#result').textContent = String(error); window.orbReactivityError = String(error); });
</script></body></html>
